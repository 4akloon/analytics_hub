# TEMPORARY diagnostic workflow — delete once publish.yml is fixed.
#
# publish.yml fails at `flutter pub get` while ci.yml succeeds on the same
# commit. This isolates the difference by running the same resolution under
# four toolchain setups. It never publishes anything.
name: Diagnose publish

on:
  push:
    branches: [ci/diagnose-publish]

permissions:
  id-token: write # so setup-dart mints PUB_TOKEN, as it does in publish.yml

jobs:
  diagnose:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        variant: [g-token-removed, e-get-then-auth-flutterpub, f-get-then-auth-dartpub]

    steps:
      - uses: actions/checkout@v5

      # G proves causation: publish.yml's exact order, but drop the pub
      # credential before resolving. If this passes, the token is the cause.
      - name: setup-dart (G only, before Flutter)
        if: matrix.variant == 'g-token-removed'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Drop the pub.dev credential before resolving (G)
        if: matrix.variant == 'g-token-removed'
        run: dart pub token remove https://pub.dev

      - name: flutter pub get
        run: flutter pub get 2>&1 | tail -20

      # E and F: resolve first, authenticate only afterwards, then exercise
      # the publish validation path (dry-run only — nothing is uploaded).
      - name: setup-dart (E/F, after resolution)
        if: matrix.variant != 'g-token-removed'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: flutter pub publish --dry-run (E)
        if: matrix.variant == 'e-get-then-auth-flutterpub'
        run: flutter pub publish --dry-run 2>&1 | tail -20
        working-directory: packages/analytics_hub_appsflyer

      - name: dart pub publish --dry-run (F)
        if: matrix.variant == 'f-get-then-auth-dartpub'
        run: dart pub publish --dry-run 2>&1 | tail -20
        working-directory: packages/analytics_hub_appsflyer
